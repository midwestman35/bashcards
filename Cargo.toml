[package]
name = "bashcards"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
animate = { version = "=0.4.0", features = ["ratatui"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
crossterm = "0.29"
directories = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
assert_fs = "1"
